[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-filter"
version = "0.1.0"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "Typed digital filters for signal analysis: IIR and FIR band filters, notch, and sliding-window smoothing and outlier removal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    # Newer Python versions raise the floors to the first releases with wheels for them.
    "numpy>=2.2; python_version < '3.14'",
    "numpy>=2.3.2; python_version == '3.14'",
    "numpy>=2.5.2; python_version >= '3.15'",
    "scipy>=1.15; python_version < '3.14'",
    "scipy>=1.16.1; python_version == '3.14'",
    "scipy>=1.18.1; python_version >= '3.15'",
]

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/SignalFilter"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/SignalFilter/issues"

[dependency-groups]
dev = [
    "basedpyright>=1.40",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
    "scipy-stubs>=1.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_filter = ["py.typed"]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
strict = true
files = ["src", "tests"]
# Test directories have no __init__.py; name their modules by path so equal file names do not collide.
explicit_package_bases = true
mypy_path = "src"

[tool.basedpyright]
include = ["src", "tests"]
exclude = [".venv", "build", "docs"]
typeCheckingMode = "recommended"
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "RUF", "D"]
# Only public classes, methods, and functions need docstrings, and multi-line ones are the local style.
ignore = ["D100", "D104", "D105", "D200"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
